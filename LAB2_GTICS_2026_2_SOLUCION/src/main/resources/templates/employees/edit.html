<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Editar empleado</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-4"><h1 class="mb-4">Editar empleado</h1><form method="post" th:action="@{/employees/guardar}" th:object="${employee}"><input type="hidden" th:field="*{employeeId}">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nombre</label><input type="text" class="form-control" th:field="*{firstName}"></div>
            <div class="col-md-6"><label class="form-label">Apellido</label><input type="text" class="form-control" th:field="*{lastName}" required></div>
            <div class="col-md-6"><label class="form-label">Correo</label><input type="text" class="form-control" th:field="*{email}" required></div>
            <div class="col-md-6"><label class="form-label">Teléfono</label><input type="text" class="form-control" th:field="*{phoneNumber}"></div>
            <div class="col-md-6"><label class="form-label">Fecha de contratación</label><input type="date" class="form-control" th:field="*{hireDate}" required></div>
            <div class="col-md-6"><label class="form-label">Puesto (job_id)</label><input type="text" class="form-control" th:field="*{jobId}" required></div>
            <div class="col-md-6"><label class="form-label">Salario</label><input type="number" step="0.01" class="form-control" th:field="*{salary}" required></div>
            <div class="col-md-6"><label class="form-label">Comisión</label><input type="number" step="0.01" class="form-control" th:field="*{commissionPct}"></div>
            <div class="col-md-6"><label class="form-label">Manager ID</label><input type="number" class="form-control" th:field="*{managerId}"></div>
            <div class="col-md-6"><label class="form-label">Department ID</label><input type="number" class="form-control" th:field="*{departmentId}"></div>
        </div>
<div class="mt-4"><button type="submit" class="btn btn-warning">Actualizar</button> <a class="btn btn-secondary" th:href="@{/employees}">Cancelar</a></div></form></div></body></html>
