<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Listado de empleados</h1>
        <a class="btn btn-primary" th:href="@{/employees/nuevo}">Nuevo empleado</a>
    </div>

    <form class="row g-2 mb-4" method="get" th:action="@{/employees/buscar}">
        <div class="col-md-4"><input type="text" class="form-control" name="texto" th:value="${texto}" placeholder="Nombre, apellido o correo"></div>
        <div class="col-md-3"><input type="text" class="form-control" name="puesto" th:value="${puesto}" placeholder="Puesto (job_id)"></div>
        <div class="col-md-3"><input type="number" step="0.01" class="form-control" name="salarioMin" th:value="${salarioMin}" placeholder="Salario mínimo"></div>
        <div class="col-md-2 d-grid"><button type="submit" class="btn btn-success">Buscar</button></div>
    </form>

    <a class="btn btn-outline-secondary mb-3" th:href="@{/employees}">Limpiar filtros</a>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Teléfono</th><th>Contratación</th><th>Puesto</th><th>Salario</th><th>Comisión</th><th>Manager ID</th><th>Department ID</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.employeeId}"></td>
                <td th:text="${employee.firstName}"></td>
                <td th:text="${employee.lastName}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.phoneNumber}"></td>
                <td th:text="${employee.hireDate}"></td>
                <td th:text="${employee.jobId}"></td>
                <td th:text="${employee.salary}"></td>
                <td th:text="${employee.commissionPct}"></td>
                <td th:text="${employee.managerId}"></td>
                <td th:text="${employee.departmentId}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-info" th:href="@{/employees/ver(id=${employee.employeeId})}">Ver</a>
                    <a class="btn btn-sm btn-warning" th:href="@{/employees/editar(id=${employee.employeeId})}">Editar</a>
                    <button type="button" class="btn btn-sm btn-danger" disabled>Eliminar</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${employees.isEmpty()}" class="alert alert-warning">No se encontraron empleados.</p>
</div>
</body>
</html>
