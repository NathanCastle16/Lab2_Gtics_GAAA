<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro de Equipo Tecnológico</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="contenedor">
    <div class="tarjeta registro">

        <h1>Registro de Equipo Tecnológico</h1>

        <form method="post" th:action="@{/equipos/registrar}">

            <label for="nombre">Nombre del Equipo</label>
            <input
                    id="nombre"
                    type="text"
                    name="nombre"
                    placeholder="Lenovo ThinkPad"
                    required>

            <label for="tipo">Tipo de Equipo</label>
            <select id="tipo" name="tipo" required>
                <option value="">Seleccione...</option>
                <option value="Laptop">Laptop</option>
                <option value="PC">PC</option>
                <option value="Servidor">Servidor</option>
            </select>

            <label for="codigoActivo">Código de Activo</label>
            <input
                    id="codigoActivo"
                    type="text"
                    name="codigoActivo"
                    placeholder="ABC123"
                    required>

            <label for="fechaAdquisicion">Fecha de Adquisición</label>
            <input
                    id="fechaAdquisicion"
                    type="date"
                    name="fechaAdquisicion"
                    required>

            <button type="submit">Registrar Equipo</button>
        </form>

        <a th:href="@{/equipos}">Ver listado de equipos</a>

    </div>
</div>

</body>
</html>
